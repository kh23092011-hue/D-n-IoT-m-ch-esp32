<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạm Giám Sát An Toàn</title>
    <!-- Firebase App (compat mode) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #f8fafc; text-align: center; padding: 20px; }
        h1 { color: #38bdf8; }
        .card-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
        .card { background: #1e293b; padding: 20px; border-radius: 12px; width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-top: 4px solid #38bdf8; }
        .card h3 { margin: 0 0 10px 0; color: #94a3b8; font-size: 1.1rem; }
        .value { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
        .alert { border-top-color: #ef4444 !important; background-color: #451a03 !important; }
    </style>
</head>
<body>

    <h1>Trạm Cảnh Báo Sớm IoT</h1>
    <p>Dữ liệu cập nhật trực tiếp từ ESP32 qua Firebase</p>

    <div class="card-container">
        <!-- Thẻ Rung Chấn -->
        <div class="card" id="vibration-card">
            <h3>Rung Chấn (Trục Z)</h3>
            <div id="vibration" class="value">--</div>
        </div>

        <!-- Thẻ Khí Gas -->
        <div class="card" id="gas-card">
            <h3>Nồng Độ Khí Gas</h3>
            <div id="gas" class="value">--</div>
        </div>

        <!-- Thẻ Cảnh Báo Lửa -->
        <div class="card" id="fireCard">
            <h3>Cảnh Báo Lửa</h3>
            <div id="fire" class="value">--</div>
        </div>
    </div>

    <script>
        // Cấu hình kết nối Firebase Realtime Database
        const firebaseConfig = {
            databaseURL: "https://dong-dat-esp32-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('SensorData');

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // ==========================================
                // 1. XỬ LÝ RUNG CHẤN (MPU6050 - Trục Z)
                // ==========================================
                const vibrationZ = data.VibrationZ !== undefined ? data.VibrationZ : 12980;
                
                // [CHÚ THÍCH CHO ÔNG CHỈNH]:
                // - mucTinh: Giá trị gốc lúc để yên trên bàn (hiện tại của ông là 12980).
                // - nguongLech: Độ lệch cho phép. Nếu (giá trị thực tế - mucTinh) vượt quá số này sẽ báo động.
                //   -> Muốn nhạy hơn (rung nhẹ đã kêu): Giảm số này xuống (vd: 800 hoặc 1000).
                //   -> Muốn cứng hơn (lắc mạnh mới kêu): Tăng số này lên (vd: 2000).
                const mucTinh = 12980;
                const nguongLech = 1000; 
                
                const vibrationEl = document.getElementById('vibration');
                const vibrationCard = document.getElementById('vibration-card');

                if (Math.abs(vibrationZ - mucTinh) > nguongLech) {
                    vibrationEl.innerText = vibrationZ + " ⚠️";
                    vibrationEl.style.color = "#ef4444";
                    vibrationCard.classList.add('alert');
                } else {
                    vibrationEl.innerText = vibrationZ;
                    vibrationEl.style.color = "#38bdf8";
                    vibrationCard.classList.remove('alert');
                }

                // ==========================================
                // 2. XỬ LÝ NỒNG ĐỘ KHÍ GAS (MQ-2)
                // ==========================================
                const gasLevel = data.GasLevel !== undefined ? data.GasLevel : 0;
                
                // [CHÚ THÍCH CHO ÔNG CHỈNH]:
                // - nguongGasMax: Mức nồng độ khí gas tối đa cho phép.
                //   -> Nếu môi trường bình thường gas quanh ~600-700, khi có gas rò rỉ nó sẽ vọt lên.
                //   -> Ông có thể đổi số 800 này thành mức cao hơn/thấp hơn tùy thực tế test thử.
                const nguongGasMax = 800;
                
                const gasEl = document.getElementById('gas');
                const gasCard = document.getElementById('gas-card');

                if (gasLevel > nguongGasMax) {
                    gasEl.innerText = gasLevel + " ⚠️";
                    gasEl.style.color = "#ef4444";
                    gasCard.classList.add('alert');
                } else {
                    gasEl.innerText = gasLevel;
                    gasEl.style.color = "#38bdf8";
                    gasCard.classList.remove('alert');
                }

                // ==========================================
                // 3. XỬ LÝ CẢNH BÁO LỬA
                // ==========================================
                const fireVal = data.FireAlert;
                const fireElement = document.getElementById('fire');
                const fireCard = document.getElementById('fireCard');

                if (fireVal == 1 || fireVal === true) {
                    fireElement.innerText = "CÓ CHÁY! 🔥";
                    fireCard.classList.add('alert');
                } else {
                    fireElement.innerText = "An Toàn ✅";
                    fireCard.classList.remove('alert');
                }
            }
        });
    </script>
</body>
</html>
