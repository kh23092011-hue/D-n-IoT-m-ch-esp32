<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trạm Cảnh Báo Sớm IoT</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
    }

    h1 {
      margin: 0 0 6px;
    }

    p {
      margin: 0 0 20px;
      color: #94a3b8;
    }

    .card-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .card {
      flex: 1 1 220px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 18px;
      transition: all 0.2s ease;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #cbd5e1;
    }

    .val {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .status {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #4ade80;
    }

    .card.alert {
      background: #450a0a;
      border-color: #ef4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.45);
    }

    .card.alert .val,
    .card.alert .status {
      color: #fca5a5;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <h1>Trạm Cảnh Báo Sớm IoT</h1>
  <p>Dữ liệu cập nhật trực tiếp từ ESP32 qua Firebase</p>

  <div class="card-container">
    <div class="card" id="vibCard">
      <h3>Rung / Độ nghiêng (AcZ)</h3>
      <div class="val" id="vibration">--</div>
      <div class="status" id="vibStatus">--</div>
    </div>

    <div class="card" id="gasCard">
      <h3>Khí Gas (MQ-2)</h3>
      <div class="val" id="gas">--</div>
      <div class="status" id="gasStatus">--</div>
    </div>

    <div class="card" id="fireCard">
      <h3>Cảm biến lửa (IR)</h3>
      <div class="val" id="fire">--</div>
      <div class="status" id="fireStatus">--</div>
    </div>
  </div>

  <script>
    const ACZ_STATIC = 16500;
    const TILT_THRESHOLD_DEG = 15;
    const GAS_THRESHOLD = 1800;

    function calcTiltDeg(aczVal, staticRef = ACZ_STATIC) {
      const num = Number(aczVal);
      if (!Number.isFinite(num) || staticRef === 0) return 0;
      const clamped = Math.max(-1, Math.min(1, num / staticRef));
      return (Math.acos(clamped) * 180) / Math.PI;
    }

    const firebaseConfig = {
      databaseURL: "https://dong-dat-esp32-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('SensorData');

    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      // 1. Rung / Độ nghiêng từ VibrationZ (mốc tĩnh 16500)
      const vibRaw = Number(data.VibrationZ ?? 0);
      const tiltDeg = calcTiltDeg(vibRaw, ACZ_STATIC);
      const vibEl = document.getElementById('vibration');
      const vibStatus = document.getElementById('vibStatus');
      const vibCard = document.getElementById('vibCard');

      vibEl.innerText = `${vibRaw} (${tiltDeg.toFixed(1)}°)`;
      if (tiltDeg >= TILT_THRESHOLD_DEG) {
        vibStatus.innerText = `CẢNH BÁO NGHIÊNG! (≥ ${TILT_THRESHOLD_DEG}°)`;
        vibCard.classList.add('alert');
      } else {
        vibStatus.innerText = "An Toàn ✅";
        vibCard.classList.remove('alert');
      }

      // 2. GasLevel
      const gasVal = Number(data.GasLevel ?? 0);
      const gasEl = document.getElementById('gas');
      const gasStatus = document.getElementById('gasStatus');
      const gasCard = document.getElementById('gasCard');

      gasEl.innerText = gasVal;
      if (gasVal >= GAS_THRESHOLD) {
        gasStatus.innerText = `CẢNH BÁO GAS CAO! (≥ ${GAS_THRESHOLD})`;
        gasCard.classList.add('alert');
      } else {
        gasStatus.innerText = "An Toàn ✅";
        gasCard.classList.remove('alert');
      }

      // 3. FireAlert
      const fireVal = data.FireAlert;
      const fireEl = document.getElementById('fire');
      const fireStatus = document.getElementById('fireStatus');
      const fireCard = document.getElementById('fireCard');

      if (fireVal == 1 || fireVal === true) {
        fireEl.innerText = "CÓ CHÁY! 🔥";
        fireStatus.innerText = "CẢNH BÁO LỬA!";
        fireCard.classList.add('alert');
      } else {
        fireEl.innerText = "Không có lửa";
        fireStatus.innerText = "An Toàn ✅";
        fireCard.classList.remove('alert');
      }
    });
  </script>
</body>
</html>
