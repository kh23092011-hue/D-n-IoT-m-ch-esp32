<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trạm Giám Sát Địa Chấn & Cháy Nổ ESP32</title>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px; display: flex; flex-direction: column; gap: 14px; }

    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    h1 { font-size: 1.15rem; color: var(--accent); }

    .btn-notif {
      background: var(--border); color: var(--text); border: 1px solid #475569;
      padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    .btn-notif:hover { background: #475569; }

    .status-box { padding: 10px; border-radius: 6px; font-weight: bold; text-align: center; font-size: 1rem; }
    .status-normal { background: rgba(16, 185, 129, 0.16); color: var(--success); border: 1px solid var(--success); }
    .status-alarm { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
    .card { background: var(--card); border-radius: 8px; padding: 12px; text-align: center; border: 1px solid var(--border); }
    .card h3 { font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    .card .val { font-size: 1.45rem; font-weight: bold; }

    .view-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 12px; }
    .canvas-container { background: var(--card); border-radius: 8px; padding: 10px; border: 1px solid var(--border); text-align: center; }
    .canvas-container h4 { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
    canvas { background: #090d16; border-radius: 6px; width: 100%; height: 210px; display: block; }
  </style>
</head>
<body>

  <header>
    <h1>HỆ THỐNG GIÁM SÁT RUNG CHẤN & CHÁY NỔ (ESP32)</h1>
    <button class="btn-notif" type="button" onclick="requestNotificationPermission()">🔔 Bật thông báo ĐTDĐ</button>
  </header>

  <div id="alarmStatus" class="status-box status-normal">AN TOÀN</div>

  <div class="grid">
    <div class="card">
      <h3>GIA TỐC (a_xy)</h3>
      <div class="val" id="valAcc">0.000 g</div>
    </div>
    <div class="card">
      <h3>KHÍ GAS (MQ-2)</h3>
      <div class="val" id="valMq2">0</div>
    </div>
    <div class="card">
      <h3>CẢNH BÁO LỬA</h3>
      <div class="val" id="valFire" style="color: var(--success);">KHÔNG</div>
    </div>
  </div>

  <div class="view-section">
    <div class="canvas-container">
      <h4>MÔ PHỎNG TÒA NHÀ RUNG LẮC 2 BÊN (THEO a_xy)</h4>
      <canvas id="buildingCanvas"></canvas>
    </div>

    <div class="canvas-container">
      <h4>ĐỒ THỊ DAO ĐỘNG GIA TỐC (a_xy)</h4>
      <canvas id="chartCanvas"></canvas>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. CẤU HÌNH FIREBASE
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBAAjIFqe6VmPs6HV6payTUWTL4CG1sXDM",
      authDomain: "dong-dat-esp32.firebaseapp.com",
      databaseURL: "https://dong-dat-esp32-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "dong-dat-esp32",
      storageBucket: "dong-dat-esp32.firebasestorage.app",
      messagingSenderId: "523130855246",
      appId: "1:523130855246:web:a67a6c58f78853e29e481f",
      measurementId: "G-4TDTF9JLW6"
    };
    const VAPID_KEY = "YOUR_WEB_PUSH_VAPID_KEY";

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref("SensorData");
    const tokensRef = firebase.database().ref("fcmTokens");
    const messaging = firebase.messaging.isSupported() ? firebase.messaging() : null;

    // =========================================================================
    // 2. KHỞI TẠO CANVAS
    // =========================================================================
    const buildCanvas = document.getElementById('buildingCanvas');
    const bCtx = buildCanvas.getContext('2d');
    const chartCanvas = document.getElementById('chartCanvas');
    const cCtx = chartCanvas.getContext('2d');

    function resizeCanvas() {
      buildCanvas.width = buildCanvas.clientWidth;
      buildCanvas.height = buildCanvas.clientHeight;
      chartCanvas.width = chartCanvas.clientWidth;
      chartCanvas.height = chartCanvas.clientHeight;
      drawChart();
    }
    window.addEventListener('resize', resizeCanvas);

    // =========================================================================
    // 3. MÔ PHỎNG TÒA NHÀ NGHIÊNG / RUNG LẮC 2 BÊN TỪ a_xy = sqrt(dx^2 + dy^2)
    // =========================================================================
    let targetAmpDeg = 0;
    let currentAngleDeg = 0;
    let swayPhase = 0;
    let isDangerShake = false;

    function drawBuilding(angleDeg) {
      const w = buildCanvas.width;
      const h = buildCanvas.height;
      bCtx.clearRect(0, 0, w, h);

      const groundY = h - 24;
      const baseX = w / 2;
      const bWidth = 64;
      const bHeight = 124;

      bCtx.strokeStyle = '#475569';
      bCtx.lineWidth = 2;
      bCtx.beginPath();
      bCtx.moveTo(14, groundY);
      bCtx.lineTo(w - 14, groundY);
      bCtx.stroke();

      bCtx.save();
      bCtx.setLineDash([4, 4]);
      bCtx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
      bCtx.lineWidth = 1;
      bCtx.beginPath();
      bCtx.moveTo(baseX, groundY);
      bCtx.lineTo(baseX, groundY - bHeight - 16);
      bCtx.stroke();
      bCtx.restore();

      bCtx.save();
      bCtx.translate(baseX, groundY);
      bCtx.rotate((angleDeg * Math.PI) / 180);

      const strokeCol = isDangerShake ? '#ef4444' : '#38bdf8';
      const fillCol = isDangerShake ? '#3b1820' : '#1e293b';

      bCtx.fillStyle = fillCol;
      bCtx.strokeStyle = strokeCol;
      bCtx.lineWidth = 2;
      bCtx.fillRect(-bWidth / 2, -bHeight, bWidth, bHeight);
      bCtx.strokeRect(-bWidth / 2, -bHeight, bWidth, bHeight);

      bCtx.fillStyle = '#94a3b8';
      for (let row = 0; row < 4; row++) {
        const yPos = -bHeight + 14 + row * 28;
        bCtx.fillRect(-18, yPos, 11, 14);
        bCtx.fillRect(7, yPos, 11, 14);
      }
      bCtx.restore();

      bCtx.fillStyle = isDangerShake ? '#ef4444' : '#38bdf8';
      bCtx.font = 'bold 12px system-ui, sans-serif';
      bCtx.textAlign = 'left';
      const sign = angleDeg > 0.05 ? '+' : '';
      bCtx.fillText(`Góc: ${sign}${angleDeg.toFixed(1)}°`, 12, 18);
    }

    function animateBuilding() {
      if (targetAmpDeg > 0.15) {
        swayPhase += 0.38;
        currentAngleDeg = Math.sin(swayPhase) * targetAmpDeg;
      } else {
        currentAngleDeg *= 0.84;
        if (Math.abs(currentAngleDeg) < 0.05) currentAngleDeg = 0;
      }

      drawBuilding(currentAngleDeg);
      requestAnimationFrame(animateBuilding);
    }

    // =========================================================================
    // 4. ĐỒ THỊ SÓNG RUNG ĐỘNG NHẸ
    // =========================================================================
    let accHistory = new Array(50).fill(0);

    function drawChart() {
      const w = chartCanvas.width;
      const h = chartCanvas.height;
      cCtx.clearRect(0, 0, w, h);

      cCtx.strokeStyle = '#38bdf8';
      cCtx.lineWidth = 1.6;
      cCtx.beginPath();

      const step = w / (accHistory.length - 1);
      for (let i = 0; i < accHistory.length; i++) {
        const val = Math.min(Math.max(accHistory[i], 0), 1.0);
        const y = h - 12 - (val * (h - 24));
        const x = i * step;
        if (i === 0) cCtx.moveTo(x, y);
        else cCtx.lineTo(x, y);
      }
      cCtx.stroke();
    }

    resizeCanvas();
    animateBuilding();

    // =========================================================================
    // 5. ĐỒNG BỘ FIREBASE REALTIME
    // =========================================================================
    let lastAlarmState = false;

    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const a_xy = Number(data.a_xy) || 0;
      const mq2 = Number(data.mq2) || 0;
      const fire = Boolean(data.fire);
      const alarm = Boolean(data.alarm);

      document.getElementById('valAcc').innerText = a_xy.toFixed(3) + ' g';
      document.getElementById('valMq2').innerText = mq2;

      const fireEl = document.getElementById('valFire');
      fireEl.innerText = fire ? 'CÓ LỬA!' : 'KHÔNG';
      fireEl.style.color = fire ? 'var(--danger)' : 'var(--success)';

      const statusEl = document.getElementById('alarmStatus');
      if (alarm) {
        statusEl.innerText = '⚠️ CẢNH BÁO RUNG CHẤN / KHÍ GAS / LỬA!';
        statusEl.className = 'status-box status-alarm';
      } else {
        statusEl.innerText = 'AN TOÀN';
        statusEl.className = 'status-box status-normal';
      }

      isDangerShake = a_xy >= 0.25 || alarm;
      targetAmpDeg = a_xy < 0.03 ? 0 : Math.min(a_xy * 45, 24);

      accHistory.push(a_xy);
      accHistory.shift();
      drawChart();

      if (alarm && !lastAlarmState) {
        sendPushNotification(a_xy, mq2, fire);
      }
      lastAlarmState = alarm;
    });

    // =========================================================================
    // 6. ĐĂNG KÝ FCM TOKEN & THÔNG BÁO TRÌNH DUYỆT / ĐIỆN THOẠI
    // =========================================================================
    function tokenToKey(token) {
      return token.replace(/[.$#\[\]]/g, '_');
    }

    async function saveFcmToken(token) {
      await tokensRef.child(tokenToKey(token)).set({
        token,
        updatedAt: Date.now()
      });
    }

    async function requestNotificationPermission() {
      if (!('Notification' in window)) {
        alert('Trình duyệt này không hỗ trợ thông báo Web.');
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        alert('Quyền thông báo chưa được cấp.');
        return;
      }

      if (messaging && 'serviceWorker' in navigator) {
        try {
          const swReg = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
          const token = await messaging.getToken({
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration: swReg
          });
          if (token) {
            await saveFcmToken(token);
            alert('Đã bật thông báo và lưu Token lên Firebase!');
            return;
          }
        } catch (err) {
          console.error('Lỗi đăng ký FCM Token:', err);
        }
      }

      alert('Đã bật quyền thông báo cục bộ trên trang web!');
    }

    if (messaging) {
      messaging.onMessage((payload) => {
        const d = payload.data || {};
        const n = payload.notification || {};
        if (Notification.permission === 'granted') {
          new Notification(d.title || n.title || '🚨 CẢNH BÁO TỪ ESP32!', {
            body: d.body || n.body || 'Phát hiện tín hiệu cảnh báo!',
            tag: 'esp32-alarm',
            renotify: true
          });
        }
      });
    }

    function sendPushNotification(acc, mq, isFire) {
      if ('Notification' in window && Notification.permission === 'granted') {
        let bodyText = `Gia tốc: ${acc.toFixed(3)}g | Gas: ${mq}`;
        if (isFire) bodyText += ' | CÓ LỬA!';

        new Notification('🚨 CẢNH BÁO TỪ ESP32!', {
          body: bodyText,
          tag: 'esp32-alarm',
          renotify: true
        });
      }
    }
  </script>
</body>
</html>
