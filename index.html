<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trạm Cảnh Báo Sớm IoT</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
    }

    h1 {
      margin: 0 0 6px;
    }

    p {
      margin: 0 0 20px;
      color: #94a3b8;
    }

    .card-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .card {
      flex: 1 1 220px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 18px;
      transition: all 0.2s ease;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #cbd5e1;
    }

    .val {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .status {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #4ade80;
    }

    .card.alert {
      background: #450a0a;
      border-color: #ef4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.45);
    }

    .card.alert .val,
    .card.alert .status {
      color: #fca5a5;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <h1>Trạm Cảnh Báo Sớm IoT</h1>
  <p>Dữ liệu cập nhật trực tiếp từ ESP32 qua Firebase</p>

  <div class="card-container">
    <div class="card" id="vibCard">
      <h3>Rung / Độ nghiêng (AcZ)</h3>
      <div class="val" id="vibration">--</div>
      <div class="status" id="vibStatus">--</div>
    </div>

    <div class="card" id="gasCard">
      <h3>Khí Gas (MQ-2)</h3>
      <div class="val" id="gas">--</div>
      <div class="status" id="gasStatus">--</div>
    </div>

    <div class="card" id="fireCard">
      <h3>Cảm biến lửa (IR)</h3>
      <div class="val" id="fire">--</div>
      <div class="status" id="fireStatus">--</div>
    </div>
  </div>

 <script>
  const CONFIG = {
    aczStatic: 16500,
    tiltThresholdDeg: 10, // Hạ xuống 10° để dễ test khi nghiêng/rung mô hình
    gasThreshold: 1800,
    aczDeltaThreshold: 800 // Dự phòng báo động nếu |AcZ - 16500| vượt 800
  };

  function calcTiltDeg(aczVal, staticRef) {
    const val = Number(aczVal);
    if (!Number.isFinite(val) || !staticRef) return 0;

    // Tính tỷ lệ so với mốc tĩnh, ép chặt vào [0, 1] để acos không bao giờ ra NaN
    const absVal = Math.abs(val);
    const ratio = absVal <= staticRef ? absVal / staticRef : staticRef / absVal;
    const clamped = Math.max(0, Math.min(1, ratio));
    return (Math.acos(clamped) * 180) / Math.PI;
  }

  // BƯỚC 1: JS tính toán & so sánh ngưỡng trước, chưa đụng tới HTML
  function evaluateSensors(data) {
    const vibRaw = Number(data.VibrationZ ?? data.AcZ ?? data.acz ?? 0);
    const gasRaw = Number(data.GasLevel ?? data.Gas ?? data.mq2 ?? 0);
    const fireRaw = data.FireAlert ?? data.Fire ?? data.fire ?? 0;

    const tiltDeg = calcTiltDeg(vibRaw, CONFIG.aczStatic);
    const deltaAcZ = Math.abs(vibRaw - CONFIG.aczStatic);
    const vibAlert = tiltDeg >= CONFIG.tiltThresholdDeg || deltaAcZ >= CONFIG.aczDeltaThreshold;

    const gasAlert = gasRaw >= CONFIG.gasThreshold;
    const fireAlert = fireRaw === 1 || fireRaw === "1" || fireRaw === true;

    return {
      vibText: `${vibRaw} (${tiltDeg.toFixed(1)}°)`,
      vibAlert,
      gasText: `${gasRaw}`,
      gasAlert,
      fireText: fireAlert ? "CÓ CHÁY! 🔥" : "An Toàn ✅",
      fireAlert
    };
  }

  // BƯỚC 2: Đẩy kết quả đã xử lý xong từ JS ra HTML
  function applyCardState(valueEl, cardEl, text, isAlert) {
    if (valueEl) valueEl.textContent = text;
    if (cardEl) {
      cardEl.classList.toggle("alert", Boolean(isAlert));
    }
  }

  function renderToDom(state) {
    const cards = document.querySelectorAll(".card");
    const vibEl = document.getElementById("vibration") || cards[0]?.querySelector(".val, p, span");
    const gasEl = document.getElementById("gas") || cards[1]?.querySelector(".val, p, span");
    const fireEl = document.getElementById("fire") || cards[2]?.querySelector(".val, p, span");

    const vibCard = document.getElementById("vibCard") || vibEl?.closest(".card") || cards[0];
    const gasCard = document.getElementById("gasCard") || gasEl?.closest(".card") || cards[1];
    const fireCard = document.getElementById("fireCard") || fireEl?.closest(".card") || cards[2];

    applyCardState(vibEl, vibCard, state.vibText, state.vibAlert);
    applyCardState(gasEl, gasCard, state.gasText, state.gasAlert);
    applyCardState(fireEl, fireCard, state.fireText, state.fireAlert);
  }

  const firebaseConfig = {
    databaseURL: "https://dong-dat-esp32-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  firebase.initializeApp(firebaseConfig);
  const dbRef = firebase.database().ref("SensorData");

  dbRef.on("value", (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    const computedState = evaluateSensors(data);
    renderToDom(computedState);
  });
</script>
</body>
</html>
