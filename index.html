<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trạm Cảnh Báo Sớm IoT</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #0f172a;
      color: #f8fafc;
    }

    h1 {
      margin: 0 0 6px;
    }

    p {
      margin: 0 0 20px;
      color: #94a3b8;
    }

    .card-container {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .card {
      flex: 1 1 220px;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 18px;
      transition: all 0.2s ease;
    }

    .card h3 {
      margin: 0 0 10px;
      font-size: 1rem;
      color: #cbd5e1;
    }

    .val {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .status {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #4ade80;
    }

    .card.alert {
      background: #450a0a;
      border-color: #ef4444;
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.45);
    }

    .card.alert .val,
    .card.alert .status {
      color: #fca5a5;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <h1>Trạm Cảnh Báo Sớm IoT</h1>
  <p>Dữ liệu cập nhật trực tiếp từ ESP32 qua Firebase</p>

  <div class="card-container">
    <div class="card" id="vibCard">
      <h3>Rung / Độ nghiêng (AcZ)</h3>
      <div class="val" id="vibration">--</div>
      <div class="status" id="vibStatus">--</div>
    </div>

    <div class="card" id="gasCard">
      <h3>Khí Gas (MQ-2)</h3>
      <div class="val" id="gas">--</div>
      <div class="status" id="gasStatus">--</div>
    </div>

    <div class="card" id="fireCard">
      <h3>Cảm biến lửa (IR)</h3>
      <div class="val" id="fire">--</div>
      <div class="status" id="fireStatus">--</div>
    </div>
  </div>

  <script>
  const ACZ_STATIC = 16500;
  const TILT_THRESHOLD_DEG = 15; // Ngưỡng nghiêng báo đỏ (độ)
  const GAS_THRESHOLD = 1800;     // Ngưỡng gas báo đỏ

  // Hàm tính góc nghiêng chống lỗi NaN tuyệt đối
  function calcTiltDeg(aczVal, staticRef = ACZ_STATIC) {
    const raw = Math.abs(Number(aczVal) || 0);
    if (raw === 0 || staticRef === 0) return 0;

    // Quy về tỷ lệ chuẩn, kẹp chặt trong khoảng [0, 1]
    let ratio = raw / staticRef;
    if (ratio > 1) ratio = 1 / ratio; // Nếu AcZ > 16500 do lực động, đảo tỷ lệ để acos không lỗi

    const clamped = Math.max(-1, Math.min(1, ratio));
    const rad = Math.acos(clamped);
    return (rad * 180) / Math.PI;
  }

  const firebaseConfig = {
    databaseURL: "https://dong-dat-esp32-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  firebase.initializeApp(firebaseConfig);
  const dbRef = firebase.database().ref('SensorData');

  dbRef.on('value', (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    // 1. Xử lý Rung / Nghiêng (AcZ)
    const vibRaw = Number(data.VibrationZ ?? data.AcZ ?? 0);
    const tiltDeg = calcTiltDeg(vibRaw, ACZ_STATIC);
    
    // Tìm thẻ chứa phần tử Rung Chấn (hỗ trợ cả id hoặc tìm theo card thứ 1)
    const vibEl = document.getElementById('vibration') || document.querySelectorAll('.card .val')[0];
    const vibCard = vibEl ? vibEl.closest('.card') : null;

    if (vibEl) {
      vibEl.innerText = `${vibRaw} (${tiltDeg.toFixed(1)}°)`;
    }
    
    // Đổi màu đỏ nếu nghiêng >= 15 độ HOẶC AcZ vượt xa mốc tĩnh (+-2000 đơn vị)
    const isVibAlert = tiltDeg >= TILT_THRESHOLD_DEG || Math.abs(vibRaw - ACZ_STATIC) > 2000;
    if (vibCard) {
      if (isVibAlert) vibCard.classList.add('alert');
      else vibCard.classList.remove('alert');
    }

    // 2. Xử lý Gas (MQ-2)
    const gasVal = Number(data.GasLevel ?? data.Gas ?? 0);
    const gasEl = document.getElementById('gas') || document.querySelectorAll('.card .val')[1];
    const gasCard = gasEl ? gasEl.closest('.card') : null;

    if (gasEl) gasEl.innerText = gasVal;
    if (gasCard) {
      if (gasVal >= GAS_THRESHOLD) gasCard.classList.add('alert');
      else gasCard.classList.remove('alert');
    }

    // 3. Xử lý Lửa (IR)
    const fireVal = data.FireAlert ?? data.Fire;
    const fireEl = document.getElementById('fire') || document.querySelectorAll('.card .val')[2];
    const fireCard = document.getElementById('fireCard') || (fireEl ? fireEl.closest('.card') : null);

    const isFire = (fireVal == 1 || fireVal === true);
    if (fireEl) {
      fireEl.innerText = isFire ? "CÓ CHÁY! 🔥" : "An Toàn ✅";
    }
    if (fireCard) {
      if (isFire) fireCard.classList.add('alert');
      else fireCard.classList.remove('alert');
    }
  });
</script>
</body>
</html>
